<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두근두근 팀 뽑기</title>
<meta name="description" content="1조~12조를 두 조씩 묶어 6개 팀을 랜덤으로 뽑아요!">
<meta property="og:title" content="🎱 두근두근 팀 뽑기">
<meta property="og:description" content="1조~12조를 두 조씩 묶어 6개 팀을 랜덤으로 뽑아요!">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ball: clamp(36px, 10.5vw, 50px);
    --ink: #3d3354;
    --ink-soft: #6f6688;
    --bg1: #fff4ec;
    --bg2: #eaf4ff;
    --accent: #ff6f91;
    --accent-dark: #e14f74;
    --wicker: #d9a066;
    --wicker-dark: #b97a3f;
    --wicker-line: #a86b33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 18%, #ffd6e4 0 60px, transparent 61px),
      radial-gradient(circle at 88% 10%, #d8ecff 0 90px, transparent 91px),
      radial-gradient(circle at 92% 78%, #fff1b8 0 70px, transparent 71px),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    overflow-x: hidden;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  header { text-align: center; }
  h1 {
    font-family: 'Jua', sans-serif;
    font-weight: 400;
    font-size: clamp(28px, 8vw, 42px);
    margin: 4px 0 2px;
    letter-spacing: -0.5px;
  }
  h1 .sp { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .sub { margin: 0; color: var(--ink-soft); font-size: 14px; }

  /* ---------- 추첨 드럼 ---------- */
  .machine { position: relative; display: flex; flex-direction: column; align-items: center; }
  .drum {
    position: relative;
    width: min(72vw, 290px);
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,0) 22%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.55), rgba(220,235,255,.45) 70%, rgba(170,200,255,.6));
    border: 8px solid #fff;
    box-shadow:
      0 0 0 4px #c9d8ff,
      inset 0 -14px 30px rgba(120,150,230,.25),
      0 18px 30px rgba(90,80,140,.18);
    overflow: hidden;
  }
  .drum .swirl {
    position: absolute; inset: -20%;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0) 0 18deg, rgba(255,255,255,.22) 18deg 24deg);
    animation: spin 9s linear infinite;
  }
  .drum.mixing .swirl { animation-duration: 1.1s; }
  .stand {
    width: 44%; height: 34px; margin-top: -6px;
    background: linear-gradient(#ff8fab, var(--accent));
    border-radius: 0 0 22px 22px;
    clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%);
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.08);
  }

  /* ---------- 공 ---------- */
  .ball {
    width: var(--ball); height: var(--ball);
    border-radius: 50%;
    display: grid; place-items: center;
    font-family: 'Jua', sans-serif;
    font-size: calc(var(--ball) * 0.36);
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.85) 0 10%, rgba(255,255,255,0) 32%), var(--c);
    box-shadow: inset -4px -6px 10px rgba(0,0,0,.18), 0 3px 6px rgba(0,0,0,.15);
    user-select: none;
    will-change: transform;
  }
  .drum .ball { position: absolute; left: 0; top: 0; }
  .ball.flying { position: fixed; z-index: 50; margin: 0; }

  /* ---------- 버튼 / 상태 ---------- */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: 'Jua', sans-serif;
    font-size: 20px;
    min-height: 52px;
    padding: 0 28px;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
    box-shadow: 0 6px 0 var(--accent-dark), 0 10px 18px rgba(225,79,116,.3);
    transition: transform .1s, box-shadow .1s, opacity .2s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
  button:disabled { opacity: .5; cursor: default; transform: none; }
  button:focus-visible { outline: 3px solid #4a7bff; outline-offset: 4px; }
  button.ghost {
    background: #fff; color: var(--ink);
    box-shadow: 0 6px 0 #d9d2ea, 0 10px 18px rgba(90,80,140,.12);
    font-size: 17px; padding: 0 20px;
  }
  button.ghost:active { box-shadow: 0 2px 0 #d9d2ea; }
  #startBtn { font-size: 24px; padding: 0 40px; animation: pulse 1.8s ease-in-out infinite; }
  #startBtn:disabled { animation: none; }
  .sound {
    position: fixed; top: 10px; right: 10px; z-index: 60;
    width: 44px; min-height: 44px; padding: 0; font-size: 20px;
    background: rgba(255,255,255,.85); color: var(--ink);
    box-shadow: 0 3px 8px rgba(0,0,0,.1);
  }
  .sound:active { transform: none; box-shadow: 0 3px 8px rgba(0,0,0,.1); }
  .status {
    min-height: 30px; margin: 0;
    font-family: 'Jua', sans-serif; font-size: 20px; text-align: center;
  }
  .status b { color: var(--accent-dark); font-weight: 400; }

  /* ---------- 바구니 ---------- */
  .baskets {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 44px 10px;
    margin-top: 24px;
  }
  .basket { position: relative; display: flex; flex-direction: column; align-items: center; }
  .basket .handle {
    position: absolute; top: calc(var(--ball) * -0.7);
    width: 76%; height: calc(var(--ball) * 1.8);
    border: 6px solid var(--wicker-dark);
    border-bottom: 0;
    border-radius: 999px 999px 0 0;
  }
  .basket .slots {
    position: relative; z-index: 1;
    display: flex; gap: 4px;
    height: var(--ball);
    margin-bottom: calc(var(--ball) * -0.18);
  }
  .slot {
    width: var(--ball); height: var(--ball);
    border-radius: 50%;
    border: 2px dashed rgba(169,107,51,.35);
  }
  .slot:has(.ball) { border-color: transparent; }
  .slot .ball { animation: land .35s ease-out; }
  .basket .rim {
    position: relative; z-index: 2;
    width: 100%; height: 14px;
    border-radius: 999px;
    background: repeating-linear-gradient(-45deg, var(--wicker-dark) 0 6px, var(--wicker-line) 6px 9px);
    box-shadow: 0 3px 0 rgba(0,0,0,.08);
  }
  .basket .body {
    position: relative; z-index: 2;
    width: 88%; height: calc(var(--ball) * 1.45);
    margin-top: -3px;
    clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%);
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 9px, rgba(120,70,30,.28) 9px 11px),
      repeating-linear-gradient(90deg, var(--wicker) 0 10px, #e6b47e 10px 18px, var(--wicker-line) 18px 20px);
    display: grid; place-items: center;
  }
  .basket .label {
    font-family: 'Jua', sans-serif;
    font-size: clamp(16px, 4.6vw, 21px);
    background: #fff;
    color: var(--tc);
    border: 3px solid var(--tc);
    padding: 1px 12px;
    border-radius: 999px;
    box-shadow: 0 2px 0 rgba(0,0,0,.12);
  }
  .basket.active .label { animation: wiggle .5s ease-in-out infinite; }
  .basket.done { animation: hop .5s ease-out; }
  .basket.done .label { background: var(--tc); color: #fff; }

  /* ---------- 결과 ---------- */
  .result {
    width: 100%;
    background: rgba(255,255,255,.9);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 10px 28px rgba(90,80,140,.14);
    text-align: center;
    animation: rise .5s ease-out;
  }
  .result[hidden] { display: none; }
  .result h2 { font-family: 'Jua', sans-serif; font-weight: 400; margin: 0 0 4px; font-size: 24px; }
  .result .time { margin: 0 0 12px; color: var(--ink-soft); font-size: 13px; }
  .result ul {
    list-style: none; padding: 0; margin: 0 0 16px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;
  }
  .result li {
    font-family: 'Jua', sans-serif; font-size: 19px;
    padding: 8px; border-radius: 14px;
    background: color-mix(in srgb, var(--tc) 14%, #fff);
  }
  .result li span { color: var(--tc); }
  .copied { min-height: 20px; margin: 10px 0 0; font-size: 14px; color: var(--ink-soft); }
  textarea.fallback { width: 100%; height: 150px; margin-top: 10px; font: 14px/1.5 inherit; }

  /* ---------- 꽃가루 ---------- */
  .confetti {
    position: fixed; top: -20px; z-index: 70; pointer-events: none;
    width: 10px; height: 14px; border-radius: 3px;
    animation: fall linear forwards;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(8deg); } }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  @keyframes hop { 30% { transform: translateY(-12px) scale(1.04); } 60% { transform: translateY(0) scale(.98); } }
  @keyframes land { 0% { transform: scale(1.25); } 60% { transform: scale(.9); } 100% { transform: scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<button class="sound" id="soundBtn" type="button" aria-label="소리 켜기/끄기" aria-pressed="true">🔊</button>

<main class="wrap">
  <header>
    <h1><span class="sp">🎱</span> 두근두근 팀 뽑기 <span class="sp" style="animation-delay:.6s">🧺</span></h1>
    <p class="sub">1조 ~ 12조를 두 조씩 묶어 6개 팀을 만들어요</p>
  </header>

  <div class="machine">
    <div class="drum" id="drum" aria-hidden="true"><div class="swirl"></div></div>
    <div class="stand"></div>
  </div>

  <p class="status" id="status" aria-live="polite">버튼을 누르면 추첨이 시작돼요!</p>

  <div class="controls">
    <button id="startBtn" type="button">🎲 시작!</button>
  </div>

  <section class="baskets" id="baskets" aria-label="팀 바구니"></section>

  <section class="result" id="result" hidden aria-live="polite">
    <h2>🎉 팀 편성 완료!</h2>
    <p class="time" id="resultTime"></p>
    <ul id="resultList"></ul>
    <div class="controls">
      <button id="copyBtn" type="button">📋 결과 복사</button>
      <button id="againBtn" type="button" class="ghost">🔄 처음으로</button>
    </div>
    <p class="copied" id="copied"></p>
  </section>
</main>

<script>
(() => {
  const GROUPS = 12;
  const TEAMS = 6;
  const BALL_COLORS = ['#ff6b6b','#ff9f43','#f0b400','#6ab04c','#22a6b3','#4834d4',
                       '#be2edd','#ff6fa8','#20bf8f','#3c8dff','#e17055','#8e7cff'];
  const TEAM_COLORS = ['#ff5c8a','#ff8a3d','#2bb673','#3b82f6','#8b5cf6','#e0a100'];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const drum = document.getElementById('drum');
  const basketsEl = document.getElementById('baskets');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const resultEl = document.getElementById('result');
  const resultList = document.getElementById('resultList');
  const resultTime = document.getElementById('resultTime');
  const copyBtn = document.getElementById('copyBtn');
  const againBtn = document.getElementById('againBtn');
  const copiedEl = document.getElementById('copied');
  const soundBtn = document.getElementById('soundBtn');

  let balls = [];
  let teams = [];
  let speedMul = 1, targetMul = 1;
  let resultText = '';

  /* ---------- 사운드 ---------- */
  let audio = null, soundOn = true;
  function pop(freq = 520, dur = 0.12) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, audio.currentTime);
      o.frequency.exponentialRampToValueAtTime(freq * 1.8, audio.currentTime + dur);
      g.gain.setValueAtTime(0.18, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) { /* 소리가 막힌 환경이면 조용히 넘어간다 */ }
  }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
  });

  /* ---------- 고정 시드 셔플 ----------
     누가 언제 눌러도 같은 결과가 나오도록 SEED로 난수를 만든다.
     새로 뽑고 싶으면 SEED 값을 아무 다른 문자열로 바꾸면 된다. */
  const SEED = 'e0951e35aad3f249';
  function seededRandom(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    let s = h >>> 0;
    return () => { // mulberry32
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr) {
    const rand = seededRandom(SEED);
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ---------- 화면 구성 ---------- */
  function build() {
    drum.querySelectorAll('.ball').forEach(b => b.remove());
    document.querySelectorAll('.ball.flying').forEach(b => b.remove());
    basketsEl.innerHTML = '';
    balls = [];
    teams = [];

    for (let n = 1; n <= GROUPS; n++) {
      const el = document.createElement('div');
      el.className = 'ball';
      el.style.setProperty('--c', BALL_COLORS[n - 1]);
      el.textContent = n + '조';
      drum.appendChild(el);
      balls.push({ n, el, active: true,
        a: Math.random() * Math.PI * 2,
        r: 0.3 + Math.random() * 0.6, rt: 0.3 + Math.random() * 0.6,
        s: (0.6 + Math.random() * 0.8) * (Math.random() < 0.5 ? -1 : 1),
        spin: Math.random() * 360 });
    }

    for (let t = 1; t <= TEAMS; t++) {
      const b = document.createElement('div');
      b.className = 'basket';
      b.style.setProperty('--tc', TEAM_COLORS[t - 1]);
      b.innerHTML = `
        <div class="handle"></div>
        <div class="slots"><span class="slot"></span><span class="slot"></span></div>
        <div class="rim"></div>
        <div class="body"><span class="label">${t}팀</span></div>`;
      basketsEl.appendChild(b);
      teams.push({ el: b, slots: [...b.querySelectorAll('.slot')], members: [] });
    }
  }

  /* ---------- 드럼 안에서 빙글빙글 ---------- */
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    speedMul += (targetMul - speedMul) * 0.06;
    const size = drum.clientWidth;
    const ball = balls[0] ? balls[0].el.offsetWidth : 40;
    const R = size / 2 - ball / 2 - 4;
    const c = size / 2 - ball / 2;
    for (const b of balls) {
      if (!b.active) continue;
      b.a += b.s * speedMul * dt;
      if (Math.random() < 0.004 * speedMul) b.rt = 0.25 + Math.random() * 0.75;
      b.r += (b.rt - b.r) * 0.04;
      b.spin += b.s * speedMul * 90 * dt;
      b.x = c + Math.cos(b.a) * R * b.r;
      b.y = c + Math.sin(b.a) * R * b.r;
      b.el.style.transform = `translate(${b.x}px, ${b.y}px) rotate(${b.spin}deg)`;
    }
    requestAnimationFrame(loop);
  }

  /* ---------- 공 하나 날려 보내기 ---------- */
  function fly(b, slot) {
    b.active = false;
    const drumRect = drum.getBoundingClientRect();
    const size = b.el.offsetWidth;
    const from = { left: drumRect.left + drum.clientLeft + b.x, top: drumRect.top + drum.clientTop + b.y,
                   width: size, height: size };
    const to = slot.getBoundingClientRect();
    const el = b.el;
    document.body.appendChild(el);
    el.classList.add('flying');
    el.style.left = from.left + 'px';
    el.style.top = from.top + 'px';
    el.style.transform = 'none';

    const popX = drumRect.left + drumRect.width / 2 - from.width / 2 - from.left;
    const popY = drumRect.top - from.height * 0.3 - from.top;
    const dx = to.left + (to.width - from.width) / 2 - from.left;
    const dy = to.top + (to.height - from.height) / 2 - from.top;

    const anim = el.animate([
      { transform: 'translate(0,0) scale(1) rotate(0deg)' },
      { transform: `translate(${popX}px, ${popY}px) scale(1.8) rotate(360deg)`, offset: 0.3 },
      { transform: `translate(${popX}px, ${popY}px) scale(1.8) rotate(360deg)`, offset: 0.55 },
      { transform: `translate(${dx}px, ${dy}px) scale(1) rotate(720deg)` }
    ], { duration: reduceMotion ? 300 : 1500, easing: 'cubic-bezier(.45,0,.3,1)', fill: 'forwards' });

    setTimeout(() => pop(660, 0.1), reduceMotion ? 50 : 400);

    return anim.finished.then(() => {
      anim.cancel();
      el.classList.remove('flying');
      el.style.left = el.style.top = el.style.transform = '';
      slot.appendChild(el);
      pop(880, 0.14);
    });
  }

  const wait = ms => new Promise(r => setTimeout(r, reduceMotion ? Math.min(ms, 100) : ms));

  /* ---------- 추첨 진행 ---------- */
  async function draw() {
    startBtn.disabled = true;
    resultEl.hidden = true;
    copiedEl.textContent = '';
    pop(400, 0.2);

    statusEl.textContent = '빙글빙글 섞는 중… 🌀';
    drum.classList.add('mixing');
    targetMul = 7;
    await wait(2200);

    const order = shuffle(balls.map(b => b.n));
    for (let i = 0; i < GROUPS; i++) {
      const t = Math.floor(i / 2);
      const team = teams[t];
      const b = balls.find(x => x.n === order[i]);
      team.el.classList.add('active');
      statusEl.innerHTML = `<b>${t + 1}팀</b>의 ${i % 2 === 0 ? '첫 번째' : '두 번째'} 조는…`;
      const revealAt = setTimeout(() => {
        statusEl.innerHTML = `<b>${t + 1}팀</b>의 ${i % 2 === 0 ? '첫 번째' : '두 번째'} 조는… <b>${b.n}조!</b>`;
      }, reduceMotion ? 0 : 500);
      await fly(b, team.slots[i % 2]);
      clearTimeout(revealAt);
      team.members.push(b.n);
      if (i % 2 === 1) {
        team.el.classList.remove('active');
        team.el.classList.add('done');
      }
      await wait(250);
    }

    targetMul = 1;
    drum.classList.remove('mixing');
    statusEl.textContent = '모든 팀이 정해졌어요! 🎊';
    showResult();
    confetti();
    startBtn.disabled = false;
    startBtn.textContent = '🎲 다시 보기';
  }

  function showResult() {
    resultTime.textContent = '누가 눌러도 똑같은 결과가 나와요 🤝';
    resultList.innerHTML = teams.map((t, i) =>
      `<li style="--tc:${TEAM_COLORS[i]}"><span>${i + 1}팀</span> · ${t.members[0]}조 + ${t.members[1]}조</li>`
    ).join('');
    resultText = '🎉 팀 편성 결과\n' +
      teams.map((t, i) => `${i + 1}팀: ${t.members[0]}조 · ${t.members[1]}조`).join('\n');
    resultEl.hidden = false;
    setTimeout(() => resultEl.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' }), 300);
  }

  function confetti() {
    if (reduceMotion) return;
    const colors = [...BALL_COLORS, ...TEAM_COLORS];
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 2.2 + Math.random() * 2 + 's';
      c.style.animationDelay = Math.random() * 0.8 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5200);
    }
  }

  /* ---------- 버튼 ---------- */
  function reset() {
    build();
    resultEl.hidden = true;
    statusEl.textContent = '버튼을 누르면 추첨이 시작돼요!';
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  startBtn.addEventListener('click', () => {
    if (teams.some(t => t.members.length)) reset();
    draw();
  });
  againBtn.addEventListener('click', () => {
    reset();
    startBtn.textContent = '🎲 시작!';
    startBtn.focus();
  });
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(resultText);
      copiedEl.textContent = '복사됐어요! 카톡방에 붙여넣기 하세요 💬';
    } catch (e) {
      copiedEl.textContent = '아래 글을 길게 눌러 복사해 주세요.';
      let ta = resultEl.querySelector('textarea.fallback');
      if (!ta) {
        ta = document.createElement('textarea');
        ta.className = 'fallback';
        ta.readOnly = true;
        resultEl.appendChild(ta);
      }
      ta.value = resultText;
      ta.select();
    }
  });

  build();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
